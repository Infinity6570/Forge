openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: assistant
    description: Universal assistant operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /assistant/dashboard:
    get:
      operationId: getAssistantDashboard
      tags: [assistant]
      summary: Get assistant dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /assistant/threads:
    get:
      operationId: listConversationThreads
      responses:
        "200":
          description: Chats ordered by pinned status and recent activity
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ConversationThread" } }
    post:
      operationId: createConversationThread
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThreadInput" }
      responses:
        "201":
          description: New empty chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationThread" }
  /assistant/threads/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getConversationThread
      responses:
        "200":
          description: Complete chronological chat history and task activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationThreadDetail" }
    patch:
      operationId: updateConversationThread
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThreadUpdate" }
      responses:
        "200":
          description: Renamed or pinned chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationThread" }
    delete:
      operationId: deleteConversationThread
      responses:
        "204": { description: Chat deleted; Task Activity records retained }
        "409": { description: Chat has an active task and cannot be deleted }
  /assistant/tasks:
    get:
      operationId: listAssistantTasks
      tags: [assistant]
      summary: List recent assistant tasks
      responses:
        "200":
          description: Recent tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssistantTask"
    post:
      operationId: createAssistantTask
      tags: [assistant]
      summary: Submit an objective to the assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "202":
          description: Task accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantTask"
  /assistant/tasks/{id}:
    get:
      operationId: getAssistantTask
      tags: [assistant]
      summary: Get task detail and execution log
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantTask"
        "404":
          description: Task not found
  /assistant/tasks/{id}/abort:
    post:
      operationId: abortAssistantTask
      tags: [assistant]
      summary: Request an immediate stop for a running task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Task stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantTask"
  /assistant/tasks/{id}/model-choice:
    post:
      operationId: chooseAssistantTaskModel
      tags: [assistant]
      summary: Confirm whether to use the recommended high-capability model for this task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskModelChoiceInput"
      responses:
        "200":
          description: Task queued with the selected model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantTask"
        "409":
          description: Task is not waiting for a model choice
  /assistant/tasks/{id}/fallback-choice:
    post:
      operationId: retryAssistantTaskStep
      tags: [assistant]
      summary: Retry a failed specialist step with its recommended model
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskFallbackChoiceInput"
      responses:
        "200":
          description: Updated task state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantTask"
        "409":
          description: No failed specialist step is waiting to be retried
  /assistant/tasks/{id}/approval-choice:
    post:
      operationId: chooseAssistantTaskApproval
      tags: [assistant]
      summary: Approve or reject a paused workspace file operation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskApprovalInput"
      responses:
        "200":
          description: Updated task after applying the approval decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantTask"
        "409":
          description: Approval request is no longer pending
  /assistant/timers:
    get:
      operationId: listAssistantTimers
      tags: [assistant]
      summary: List active and recent timers
      responses:
        "200":
          description: Timers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssistantTimer"
    post:
      operationId: createAssistantTimer
      tags: [assistant]
      summary: Create a countdown or scheduled reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimerInput"
      responses:
        "201":
          description: Timer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantTimer"
  /assistant/timers/{id}:
    delete:
      operationId: deleteAssistantTimer
      tags: [assistant]
      summary: Dismiss or remove a timer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Timer removed
  /assistant/notes:
    get:
      operationId: listAssistantNotes
      tags: [assistant]
      summary: List saved notes
      responses:
        "200":
          description: Saved notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssistantNote"
    post:
      operationId: createAssistantNote
      tags: [assistant]
      summary: Save a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantNote"
  /assistant/notes/{id}:
    delete:
      operationId: deleteAssistantNote
      tags: [assistant]
      summary: Delete a saved note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Note deleted
  /assistant/files:
    get:
      operationId: listAssistantFiles
      tags: [assistant]
      summary: List uploaded workspace documents
      responses:
        "200":
          description: Uploaded files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssistantFile"
    post:
      operationId: uploadAssistantFile
      tags: [assistant]
      summary: Upload a document to the private workspace
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadInput"
      responses:
        "201":
          description: Uploaded and indexed document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantFile"
  /assistant/files/{id}:
    delete:
      operationId: deleteAssistantFile
      tags: [assistant]
      summary: Delete an uploaded workspace document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: File deleted
  /assistant/settings:
    get:
      operationId: getAssistantSettings
      tags: [assistant]
      summary: Read model selection and credential presence
      responses:
        "200":
          description: Assistant settings without exposing credential values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSettings"
    put:
      operationId: updateAssistantSettings
      tags: [assistant]
      summary: Update local model configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantSettingsInput"
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSettings"
  /assistant/settings/model:
    patch:
      operationId: applyAssistantModel
      tags: [assistant]
      summary: Apply the working model without modifying keys or execution settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelSelectionInput"
      responses:
        "200":
          description: Active working model saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSettings"
  /assistant/settings/keys:
    put:
      operationId: saveAssistantProviderKeys
      tags: [assistant]
      summary: Save provider credentials without changing the working model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderKeysInput"
      responses:
        "200":
          description: Credential presence refreshed without exposing values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSettings"
  /assistant/workspace.zip:
    get:
      operationId: downloadAssistantWorkspace
      tags: [assistant]
      summary: Download uploaded source files and notes as a zip archive
      responses:
        "200":
          description: Workspace zip archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /workspace/preview:
    get:
      operationId: getWorkspacePreview
      tags: [assistant]
      summary: Get the available workspace previews and running apps
      responses:
        "200":
          description: Preview state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePreviewStatus"
  /workspace/preview/stop:
    post:
      operationId: stopWorkspacePreviewApp
      tags: [assistant]
      summary: Stop a workspace app started by the assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspacePreviewStopInput"
      responses:
        "200":
          description: Updated preview state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePreviewStatus"
        "404":
          description: App process not found
  /workspace/preview/stop-all:
    post:
      operationId: stopAllWorkspacePreviewApps
      tags: [assistant]
      summary: Stop all active workspace app previews when the preview panel closes
      responses:
        "200":
          description: Number of stopped app processes and updated preview state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePreviewStopAllResult"
  /workspace/preview/static/{path}:
    get:
      operationId: getWorkspacePreviewAsset
      tags: [assistant]
      summary: Serve a safe HTML app asset from the workspace root
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Workspace preview asset
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: Asset not available for preview
  /workspace/preview/server/{app_id}/{path}:
    parameters:
      - name: app_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: path
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getWorkspacePreviewServerAsset
      tags: [assistant]
      summary: Proxy a GET request to a running workspace app
      responses:
        "200":
          description: Response from the running app
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: App process not found
        "502":
          description: Workspace app is not responding
    post:
      operationId: postWorkspacePreviewServerAsset
      tags: [assistant]
      summary: Proxy a POST request to a running workspace app
      responses:
        "200":
          description: Response from the running app
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: App process not found
        "502":
          description: Workspace app is not responding
    put:
      operationId: putWorkspacePreviewServerAsset
      tags: [assistant]
      summary: Proxy a PUT request to a running workspace app
      responses:
        "200":
          description: Response from the running app
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
    patch:
      operationId: patchWorkspacePreviewServerAsset
      tags: [assistant]
      summary: Proxy a PATCH request to a running workspace app
      responses:
        "200":
          description: Response from the running app
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
    delete:
      operationId: deleteWorkspacePreviewServerAsset
      tags: [assistant]
      summary: Proxy a DELETE request to a running workspace app
      responses:
        "200":
          description: Response from the running app
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DashboardSummary:
      type: object
      required: [activeTasks, completedTasks, activeTimers, notesCount, filesCount, recentTasks]
      properties:
        activeTasks: { type: integer }
        completedTasks: { type: integer }
        activeTimers: { type: integer }
        notesCount: { type: integer }
        filesCount: { type: integer }
        recentTasks:
          type: array
          items:
            $ref: "#/components/schemas/AssistantTask"
    ConversationThread:
      type: object
      required: [id, title, pinned, createdAt, updatedAt, activeTaskId, messageCount]
      properties:
        id: { type: string }
        title: { type: string }
        pinned: { type: boolean }
        activeTaskId: { type: ["string", "null"] }
        messageCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConversationMessage:
      type: object
      required: [id, threadId, taskId, role, content, thoughtSteps, isToolCall, createdAt]
      properties:
        id: { type: string }
        threadId: { type: string }
        taskId: { type: string }
        role: { type: string, enum: [user, assistant, tool] }
        content: { type: string }
        thoughtSteps: { type: array, items: { $ref: "#/components/schemas/TaskLog" } }
        isToolCall: { type: boolean }
        createdAt: { type: string, format: date-time }
    ConversationThreadDetail:
      allOf:
        - { $ref: "#/components/schemas/ConversationThread" }
        - type: object
          required: [messages, tasks]
          properties:
            messages: { type: array, items: { $ref: "#/components/schemas/ConversationMessage" } }
            tasks: { type: array, items: { $ref: "#/components/schemas/AssistantTask" } }
    ThreadInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 100, default: "New Chat" }
    ThreadUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        pinned: { type: boolean }
    AssistantTask:
      type: object
      required: [id, objective, status, currentStep, result, error, logs, provider, modelId, recommendationKind, recommendationReason, recommendedProvider, recommendedModelId, retryAvailable, requiresModelConfirmation, pendingApprovalId, pendingApprovalKind, approvalSummary, requiresApproval, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        objective: { type: string }
        threadId: { type: ["string", "null"] }
        status:
          type: string
          enum: [queued, running, awaiting_confirmation, awaiting_approval, completed, failed, cancelled]
        currentStep: { type: ["string", "null"] }
        result: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        logs:
          type: array
          items:
            $ref: "#/components/schemas/TaskLog"
        provider: { type: string, enum: [openai, deepseek, gemini, openrouter, ollama] }
        modelId: { type: string }
        recommendationKind: { type: ["string", "null"], enum: [complexity, fallback, null] }
        recommendationReason: { type: ["string", "null"] }
        recommendedProvider: { type: ["string", "null"], enum: [openai, deepseek, gemini, openrouter, ollama, null] }
        recommendedModelId: { type: ["string", "null"] }
        retryAvailable: { type: boolean }
        requiresModelConfirmation: { type: boolean }
        pendingApprovalId: { type: ["string", "null"] }
        pendingApprovalKind: { type: ["string", "null"] }
        approvalSummary: { type: ["string", "null"] }
        requiresApproval: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskLog:
      type: object
      required: [id, kind, message, createdAt]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [plan, agent, tool, result, error, info, warning, success]
        message: { type: string }
        createdAt: { type: string, format: date-time }
    TaskInput:
      type: object
      required: [objective]
      properties:
        objective: { type: string, minLength: 1, maxLength: 12000 }
        threadId: { type: ["string", "null"] }
        provider:
          type: string
          enum: [openai, deepseek, gemini, openrouter, ollama]
        modelId:
          type: string
          maxLength: 120
        fileIds:
          type: array
          items: { type: string, format: uuid }
    TaskModelChoiceInput:
      type: object
      required: [switchToRecommendation]
      properties:
        switchToRecommendation: { type: boolean }
    TaskFallbackChoiceInput:
      type: object
      required: [retry]
      properties:
        retry: { type: boolean }
    TaskApprovalInput:
      type: object
      required: [approvalId, approve]
      properties:
        approvalId: { type: string, minLength: 1, maxLength: 64 }
        approve: { type: boolean }
    AssistantTimer:
      type: object
      required: [id, label, kind, scheduledFor, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        kind:
          type: string
          enum: [countdown, alarm]
        scheduledFor: { type: string, format: date-time }
        status:
          type: string
          enum: [active, fired, dismissed]
        createdAt: { type: string, format: date-time }
    TimerInput:
      type: object
      required: [label, kind, scheduledFor]
      properties:
        label: { type: string, minLength: 1, maxLength: 200 }
        kind:
          type: string
          enum: [countdown, alarm]
        scheduledFor: { type: string, format: date-time }
        recurrence:
          type: string
          enum: [none, daily, weekly]
    AssistantNote:
      type: object
      required: [id, title, content, tags, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NoteInput:
      type: object
      required: [title, content]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        content: { type: string, maxLength: 200000 }
        tags:
          type: array
          items: { type: string }
    AssistantFile:
      type: object
      required: [id, name, mimeType, sizeBytes, extractedText, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        extractedText: { type: string }
        createdAt: { type: string, format: date-time }
    FileUploadInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    WorkspacePreviewApp:
      type: object
      required: [id, framework, entryPath, port, localUrl, previewUrl, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        framework:
          type: string
          enum: [streamlit, flask, fastapi]
        entryPath: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        localUrl: { type: string, format: uri }
        previewUrl: { type: string }
        status:
          type: string
          enum: [running]
        startedAt: { type: string, format: date-time }
    WorkspacePreviewStatus:
      type: object
      required: [staticAvailable, staticEntryPath, staticPreviewUrl, pythonPreviewsEnabled, pythonPreviewRuntimeLimitSeconds, apps]
      properties:
        staticAvailable: { type: boolean }
        staticEntryPath: { type: ["string", "null"] }
        staticPreviewUrl: { type: ["string", "null"] }
        pythonPreviewsEnabled: { type: boolean }
        pythonPreviewRuntimeLimitSeconds: { type: integer, minimum: 1 }
        apps:
          type: array
          items:
            $ref: "#/components/schemas/WorkspacePreviewApp"
    WorkspacePreviewStopAllResult:
      type: object
      required: [stopped, preview]
      properties:
        stopped: { type: integer, minimum: 0 }
        preview:
          $ref: "#/components/schemas/WorkspacePreviewStatus"
    WorkspacePreviewStopInput:
      type: object
      required: [appId]
      properties:
        appId: { type: string, format: uuid }
    AssistantSettings:
      type: object
      required: [provider, modelId, fallbackModelId, ollamaBaseUrl, localSetupAllowed, providerSettingsAllowed, hasOpenaiKey, hasDeepseekKey, hasGeminiKey, hasOpenrouterKey, codeRunnerEnabled, appPreviewsEnabled]
      properties:
        provider: { type: string, enum: [openai, deepseek, gemini, openrouter, ollama] }
        modelId: { type: string }
        fallbackModelId: { type: string }
        ollamaBaseUrl: { type: string }
        localSetupAllowed: { type: boolean }
        providerSettingsAllowed: { type: boolean }
        hasOpenaiKey: { type: boolean }
        hasDeepseekKey: { type: boolean }
        hasGeminiKey: { type: boolean }
        hasOpenrouterKey: { type: boolean }
        codeRunnerEnabled: { type: boolean }
        appPreviewsEnabled: { type: boolean }
    ModelSelectionInput:
      type: object
      required: [provider, modelId]
      properties:
        provider: { type: string, enum: [openai, deepseek, gemini, openrouter, ollama] }
        modelId: { type: string, minLength: 1, maxLength: 120, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,119}$' }
        fallbackModelId: { type: string, maxLength: 120, pattern: '^$|^[A-Za-z0-9][A-Za-z0-9._:/-]{0,119}$' }
    ProviderKeysInput:
      type: object
      properties:
        openaiApiKey: { type: ["string", "null"], maxLength: 1000 }
        deepseekApiKey: { type: ["string", "null"], maxLength: 1000 }
        geminiApiKey: { type: ["string", "null"], maxLength: 1000 }
        openrouterApiKey: { type: ["string", "null"], maxLength: 1000 }
        ollamaBaseUrl: { type: string, maxLength: 500 }
    AssistantSettingsInput:
      type: object
      required: [provider, modelId]
      properties:
        provider: { type: string, enum: [openai, deepseek, gemini, openrouter, ollama] }
        modelId: { type: string, minLength: 1, maxLength: 120, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,119}$' }
        fallbackModelId: { type: string, maxLength: 120, pattern: '^$|^[A-Za-z0-9][A-Za-z0-9._:/-]{0,119}$' }
