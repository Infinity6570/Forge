    <script>
      try {
        var t = localStorage.getItem('morrow-theme');
        document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : 'scifi';
      } catch (_) {
        document.documentElement.dataset.theme = 'scifi';
      }
      try {
        document.documentElement.dataset.cyberFx = localStorage.getItem('forge-cyber-fx') === 'off' ? 'off' : 'on';
      } catch (_) { document.documentElement.dataset.cyberFx = 'on'; }
    </script>
